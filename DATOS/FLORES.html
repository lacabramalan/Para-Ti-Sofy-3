<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#26122c">
  <link rel="stylesheet" href="css/main.css">
  <title>30 veces Sofy ✦</title>
</head>
<body>
  <main class="garden">
    <a class="back" href="../index.html" aria-label="Volver a la portada">←</a>
    <div class="stars" aria-hidden="true"></div>
    <div class="shooting shooting-one" aria-hidden="true"></div>
    <div class="shooting shooting-two" aria-hidden="true"></div>
    <div class="hearts" aria-hidden="true"><span>♥</span><span>♥</span><span>♥</span><span>♥</span><span>♥</span></div>
    <section class="letter" aria-live="polite">
      <p class="eyebrow">30 razones, aun con kilómetros de por medio</p>
      <h1>Para ti, <em>Sofy</em></h1>
      <div class="line"></div>
      <p id="love-line" class="love-line">Porque la distancia no pudo evitar que te sintiera cerquita de mi corazón.</p>
      <p id="counter" class="counter">01 / 30</p>
      <button id="next-line" type="button">Dime otra razón <span>♥</span></button>
      <p class="hint">Tócalo hasta llegar al final.</p>
    </section>
    <section class="flowers" aria-label="Un ramo de flores para Sofy">
      <div class="stem stem-one"><div class="flower bloom-yellow"><i></i><i></i><i></i><i></i><i></i><b></b></div></div>
      <div class="stem stem-two"><div class="flower bloom-yellow bloom-gold"><i></i><i></i><i></i><i></i><i></i><b></b></div></div>
      <div class="stem stem-three"><div class="flower bloom-yellow bloom-soft"><i></i><i></i><i></i><i></i><i></i><b></b></div></div>
      <div class="leaf leaf-one"></div><div class="leaf leaf-two"></div><div class="leaf leaf-three"></div>
    </section>
    <p class="final-note">Estas flores amarillas viajan por los kilómetros para decirte: te elegiría una y otra vez.</p>
  </main>
  <script src="main.js"></script>
</body>
</html>
